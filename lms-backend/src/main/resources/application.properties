spring.application.name=lms-backend

spring.datasource.url=jdbc:mysql://localhost:3306/lmsdb
spring.datasource.username=lms_user
spring.datasource.password=lms

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


server.port=8087


spring.devtools.restart.exclude=static/**,templates/**,uploads/**

# Hikari optimization
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=5

jwtSecret= 
#24H before token expires
jwtExpirationMs=86400000 
